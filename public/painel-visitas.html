<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visitas dos Promotores</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800;900&display=swap">
<style>
/* Layout: relatório em coluna única, cartões grandes; filtros por botões; cores por rede. Tema claro único (marca Cardoso). */
:root{
  --bg:#EDE7DD; --panel:#FBF9F5; --panel2:#F3EEE6; --line:#E2D9CB;
  --ink:#0a2530; --ink2:#5b6b72; --accent:#da3a2f; --accent-ink:#8f1f17; --cyan:#2e9aa5; --good:#2e7d32;
  --shadow:0 2px 4px rgba(10,37,48,.05),0 10px 26px rgba(10,37,48,.08);
  color-scheme:light;
  font-family:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-size:20px;line-height:1.4;-webkit-text-size-adjust:100%}
.wrap{max-width:1100px;margin:0 auto;padding-block:26px;padding-left:18px;padding-right:18px}
h1,h2,h3{text-wrap:balance;margin:0}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- tela de senha ---------- */
#lock{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:22px;z-index:50}
.lockcard{background:var(--panel);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);max-width:460px;width:100%;padding:38px 30px;text-align:center}
.locklogo{width:68px;height:68px;border-radius:20px;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:36px;margin:0 auto 16px}
.lockcard h1{font-size:30px;font-weight:800;margin-bottom:6px}
.lockcard p{color:var(--ink2);font-size:18px;margin:0 0 22px}
#pw{width:100%;font-size:24px;font-family:inherit;padding:16px 18px;border:2px solid var(--line);border-radius:16px;text-align:center;background:#fff;color:var(--ink)}
#pw:focus{outline:none;border-color:var(--accent)}
.btn{font-family:inherit;font-size:22px;font-weight:800;border:none;border-radius:16px;padding:16px 22px;cursor:pointer;background:var(--accent);color:#fff;box-shadow:var(--shadow)}
.btn:active{transform:translateY(1px)}
#lockbtn{width:100%;margin-top:14px}
#lockerr{color:var(--accent-ink);font-weight:700;font-size:18px;min-height:24px;margin-top:12px}

/* ---------- cabeçalho ---------- */
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:22px}
.head .eye{font-size:16px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.head h1{font-size:40px;font-weight:900;letter-spacing:-.02em;line-height:1.05}
.head .per{font-size:19px;color:var(--ink2);font-weight:600;text-align:right}
.head .per b{color:var(--ink)}

/* ---------- filtros ---------- */
.filters{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:18px 18px 20px;margin-bottom:22px}
.flabel{font-size:15px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2);margin:4px 2px 10px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:9px;font-family:inherit;font-size:18px;font-weight:700;color:var(--ink);background:var(--panel2);border:2px solid var(--line);border-radius:999px;padding:11px 18px;cursor:pointer;transition:.12s}
.chip:hover{border-color:var(--ink2)}
.chip .dot{width:15px;height:15px;border-radius:50%;flex:none}
.chip .n{font-size:15px;color:var(--ink2);font-weight:800}
.chip.on{color:#fff;border-color:transparent}
.chip.on .n{color:rgba(255,255,255,.85)}
.chip.all.on{background:var(--ink);color:#fff}
.clear{margin-top:4px}
.clearbtn{font-family:inherit;font-size:17px;font-weight:800;border:2px solid var(--line);background:#fff;color:var(--accent-ink);border-radius:12px;padding:10px 18px;cursor:pointer}
.search{width:100%;font-family:inherit;font-size:20px;padding:14px 18px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);margin-bottom:14px}
.search:focus{outline:none;border-color:var(--accent)}
.search::placeholder{color:var(--ink2)}

/* ---------- KPIs ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:20px 22px}
.kpi.accent{background:linear-gradient(135deg,#e2473b,#b92d23);border-color:transparent;color:#fff}
.kpi .kl{font-size:16px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink2)}
.kpi.accent .kl{color:rgba(255,255,255,.9)}
.kpi .kv{font-size:54px;font-weight:900;letter-spacing:-.03em;line-height:1}
.kpi .ks{font-size:16px;font-weight:600;color:var(--ink2);margin-top:4px}
.kpi.accent .ks{color:rgba(255,255,255,.9)}

/* ---------- cartões de gráfico ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:22px 24px;margin-bottom:18px;min-width:0}
.card h2{font-size:24px;font-weight:800;margin-bottom:4px}
.card .sub{font-size:16px;color:var(--ink2);margin-bottom:18px}

/* barras horizontais */
.bars{display:flex;flex-direction:column;gap:14px}
.bar{display:grid;grid-template-columns:140px 1fr;gap:14px;align-items:center}
.bar .bn{font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .track{position:relative;background:var(--panel2);border-radius:12px;height:40px;overflow:hidden}
.bar .fill{height:100%;border-radius:12px;min-width:3px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar .val{position:absolute;top:0;height:100%;display:flex;align-items:center;font-size:19px;font-weight:900;color:#fff;padding:0 14px}
.bar .val.out{color:var(--ink);padding-left:12px}

/* semanas (vertical) */
.weeks{display:flex;align-items:flex-end;gap:8px;height:220px;padding-top:10px;overflow-x:auto}
.wk{flex:1;min-width:34px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:8px;height:100%}
.wk .wb{width:100%;max-width:46px;background:var(--cyan);border-radius:10px 10px 4px 4px;min-height:4px;transition:height .5s cubic-bezier(.2,.8,.2,1);display:flex;align-items:flex-start;justify-content:center}
.wk .wv{font-size:15px;font-weight:900;color:#fff;padding-top:5px}
.wk .wl{font-size:14px;font-weight:700;color:var(--ink2);white-space:nowrap}

.empty{color:var(--ink2);font-size:19px;padding:20px 0;text-align:center}
.foot{text-align:center;color:var(--ink2);font-size:15px;margin-top:24px}

@media(max-width:780px){
  body{font-size:19px}
  .head h1{font-size:32px}.head .per{text-align:left}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .grid2{grid-template-columns:1fr}
  .kpi .kv{font-size:46px}
  .bar{grid-template-columns:110px 1fr}
}
</style>
</head>
<body>

<div id="lock">
  <div class="lockcard">
    <div class="locklogo">C</div>
    <h1>Visitas dos Promotores</h1>
    <p>Digite a senha para abrir o painel.</p>
    <input id="pw" type="password" inputmode="text" autocomplete="off" placeholder="senha" autofocus>
    <button id="lockbtn" class="btn">Abrir painel</button>
    <div id="lockerr"></div>
  </div>
</div>

<div id="app" class="wrap" hidden></div>

const MONTH_NAMES={'01':'Janeiro','02':'Fevereiro','03':'Março','04':'Abril','05':'Maio','06':'Junho','07':'Julho','08':'Agosto','09':'Setembro','10':'Outubro','11':'Novembro','12':'Dezembro'};

// estado de filtros
const F={prom:new Set(),net:new Set(),month:new Set(),search:''};
let promColor={},netColor={},maxWeek=null,allWeeksSorted=[],allMonths=[];
const noacc=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();

function wkKey(d){ // segunda-feira da semana (YYYY-MM-DD)
  const dt=new Date(d+'T00:00:00'); const day=(dt.getDay()+6)%7; dt.setDate(dt.getDate()-day);
  return dt.toISOString().slice(0,10);
}
function wkLabel(k){const [y,m,d]=k.split('-');return d+'/'+m;}
function fmtInt(n){return n.toLocaleString('pt-BR');}

function setup(){
  const proms=[...new Set(VISITS.map(v=>v.p))].sort();
  proms.forEach((p,i)=>promColor[p]=PROM_COLORS[i%PROM_COLORS.length]);
  const netCount={};VISITS.forEach(v=>netCount[v.n]=(netCount[v.n]||0)+1);
  const nets=Object.keys(netCount).sort((a,b)=>netCount[b]-netCount[a]);
  nets.forEach((n,i)=>netColor[n]=NET_PALETTE[i%NET_PALETTE.length]);
  allWeeksSorted=[...new Set(VISITS.map(v=>wkKey(v.d)))].sort();
  maxWeek=allWeeksSorted[allWeeksSorted.length-1];
  allMonths=[...new Set(VISITS.map(v=>v.d.slice(0,7)))].sort();
}

function filtered(){
  const q=noacc(F.search.trim());
  return VISITS.filter(v=>{
    if(F.prom.size && !F.prom.has(v.p)) return false;
    if(F.net.size && !F.net.has(v.n)) return false;
    if(F.month.size && !F.month.has(v.d.slice(0,7))) return false;
    if(q && !noacc(v.s+' '+v.p).includes(q)) return false;
    return true;
  });
}

function chip(label,active,onClass,color,count,onClick){
  const b=document.createElement('button');
  b.className='chip'+(active?' on':'')+(onClass?(' '+onClass):'');
  if(active && color && onClass!=='all') b.style.background=color;
  b.innerHTML=(color&&onClass!=='all'?`<span class="dot" style="background:${color}"></span>`:'')+label+(count!=null?` <span class="n">${fmtInt(count)}</span>`:'');
  b.onclick=onClick; return b;
}

function render(){
  const app=document.getElementById('app');
  const V=filtered();
  const totalAll=VISITS.length;
  // agregados
  const byProm={},byNet={},byStore={},byWeek={};
  V.forEach(v=>{byProm[v.p]=(byProm[v.p]||0)+1;byNet[v.n]=(byNet[v.n]||0)+1;byStore[v.s]=(byStore[v.s]||0)+1;const k=wkKey(v.d);byWeek[k]=(byWeek[k]||0)+1;});
  const lojas=new Set(V.map(v=>v.s)).size;
  const promsActive=new Set(V.map(v=>v.p)).size;
  const weeks=allWeeksSorted.length;

  // contagens p/ os chips (globais, pra orientar)
  const promCountAll={},netCountAll={};
  VISITS.forEach(v=>{promCountAll[v.p]=(promCountAll[v.p]||0)+1;netCountAll[v.n]=(netCountAll[v.n]||0)+1;});

  app.innerHTML='';
  // header
  const head=document.createElement('div');head.className='head';
  head.innerHTML=`<div><div class="eye">Cardoso · Trade Marketing</div><h1>Visitas dos Promotores</h1></div>
    <div class="per">Período<br><b>29/06/2026 a 04/10/2026</b></div>`;
  app.appendChild(head);

  // filtros
  const fl=document.createElement('div');fl.className='filters';
  // Buscar
  const sl=document.createElement('div');sl.className='flabel';sl.textContent='Buscar loja ou promotor';fl.appendChild(sl);
  const si=document.createElement('input');si.id='q';si.className='search';si.type='text';si.placeholder='Digite o nome…';si.value=F.search;si.autocomplete='off';
  si.addEventListener('input',e=>{const pos=e.target.selectionStart;F.search=e.target.value;render();const ni=document.getElementById('q');if(ni){ni.focus();try{ni.setSelectionRange(pos,pos);}catch(_){}}});
  fl.appendChild(si);
  // Promotor
  const pl=document.createElement('div');pl.className='flabel';pl.textContent='Promotor';fl.appendChild(pl);
  const pc=document.createElement('div');pc.className='chips';
  pc.appendChild(chip('Todos',F.prom.size===0,'all',null,null,()=>{F.prom.clear();render();}));
  Object.keys(promColor).sort().forEach(p=>pc.appendChild(chip(p,F.prom.has(p),'',promColor[p],promCountAll[p],()=>{F.prom.has(p)?F.prom.delete(p):F.prom.add(p);render();})));
  fl.appendChild(pc);
  // Rede
  const nl=document.createElement('div');nl.className='flabel';nl.textContent='Rede';fl.appendChild(nl);
  const nc=document.createElement('div');nc.className='chips';
  nc.appendChild(chip('Todas',F.net.size===0,'all',null,null,()=>{F.net.clear();render();}));
  Object.keys(netColor).forEach(n=>nc.appendChild(chip(n,F.net.has(n),'',netColor[n],netCountAll[n],()=>{F.net.has(n)?F.net.delete(n):F.net.add(n);render();})));
  fl.appendChild(nc);
  // Mês
  const ml=document.createElement('div');ml.className='flabel';ml.textContent='Mês';fl.appendChild(ml);
  const mc=document.createElement('div');mc.className='chips';
  mc.appendChild(chip('Todos',F.month.size===0,'all',null,null,()=>{F.month.clear();render();}));
  allMonths.forEach(m=>{const nm=MONTH_NAMES[m.slice(5,7)]+' '+m.slice(0,4);mc.appendChild(chip(nm,F.month.has(m),'all',null,null,()=>{F.month.has(m)?F.month.delete(m):F.month.add(m);render();}));});
  fl.appendChild(mc);
  if(F.prom.size||F.net.size||F.month.size||F.search.trim()){
    const cl=document.createElement('div');cl.className='clear';
    const cb=document.createElement('button');cb.className='clearbtn';cb.textContent='✕ Limpar filtros';
    cb.onclick=()=>{F.prom.clear();F.net.clear();F.month.clear();F.search='';render();};
    cl.appendChild(cb);fl.appendChild(cl);
  }
  app.appendChild(fl);

  // KPIs
  const k=document.createElement('div');k.className='kpis';
  k.innerHTML=`
    <div class="kpi accent"><div class="kl">Visitas</div><div class="kv tnum">${fmtInt(V.length)}</div><div class="ks">${V.length===totalAll?'no período todo':'com os filtros'}</div></div>
    <div class="kpi"><div class="kl">Lojas</div><div class="kv tnum">${fmtInt(lojas)}</div><div class="ks">lojas diferentes</div></div>
    <div class="kpi"><div class="kl">Promotores</div><div class="kv tnum">${fmtInt(promsActive)}</div><div class="ks">em campo</div></div>
    <div class="kpi"><div class="kl">Semanas</div><div class="kv tnum">${fmtInt(weeks)}</div><div class="ks">de histórico</div></div>`;
  app.appendChild(k);

  if(V.length===0){
    const e=document.createElement('div');e.className='card';e.innerHTML='<div class="empty">Nenhuma visita com esses filtros.<br>Toque em “Limpar filtros”.</div>';
    app.appendChild(e);return;
  }

  // barras horizontais helper
  function barsCard(title,sub,entries,colorFn){
    const card=document.createElement('div');card.className='card';
    card.innerHTML=`<h2>${title}</h2><div class="sub">${sub}</div>`;
    const wrap=document.createElement('div');wrap.className='bars';
    const max=Math.max(...entries.map(e=>e[1]));
    entries.forEach(([name,val])=>{
      const pct=Math.max(4,(val/max)*100); const col=colorFn(name); const inside=pct>24;
      const row=document.createElement('div');row.className='bar';
      row.innerHTML=`<div class="bn" title="${name}">${name}</div>
        <div class="track"><div class="fill" style="width:${pct}%;background:${col}"></div>
        <div class="val ${inside?'':'out'}" style="${inside?'left:0':'left:'+pct+'%'}">${fmtInt(val)}</div></div>`;
      wrap.appendChild(row);
    });
    card.appendChild(wrap);return card;
  }

  const g2=document.createElement('div');g2.className='grid2';
  const promEntries=Object.entries(byProm).sort((a,b)=>b[1]-a[1]);
  g2.appendChild(barsCard('Quem mais visitou','Visitas por promotor',promEntries,n=>promColor[n]||'#888'));
  const netEntries=Object.entries(byNet).sort((a,b)=>b[1]-a[1]);
  g2.appendChild(barsCard('Visitas por rede','Quantas visitas em cada rede',netEntries,n=>netColor[n]||'#888'));
  app.appendChild(g2);

  // semanas
  const wc=document.createElement('div');wc.className='card';
  wc.innerHTML='<h2>Visitas por semana</h2><div class="sub">Evolução ao longo do tempo</div>';
  const wrapw=document.createElement('div');wrapw.className='weeks';
  const wkMax=Math.max(...allWeeksSorted.map(k=>byWeek[k]||0),1);
  allWeeksSorted.forEach(key=>{
    const val=byWeek[key]||0; const h=Math.max(4,(val/wkMax)*170);
    const col=document.createElement('div');col.className='wk';
    col.innerHTML=`<div class="wb" style="height:${h}px">${val>0?`<span class="wv">${val}</span>`:''}</div><div class="wl">${wkLabel(key)}</div>`;
    wrapw.appendChild(col);
  });
  wc.appendChild(wrapw);app.appendChild(wc);

  // top lojas
  const topEntries=Object.entries(byStore).sort((a,b)=>b[1]-a[1]).slice(0,12);
  const tcard=barsCard('Lojas mais visitadas','As 12 lojas com mais visitas',topEntries,n=>netColor[ (VISITS.find(v=>v.s===n)||{}).n ]||'#888');
  app.appendChild(tcard);

  const foot=document.createElement('div');foot.className='foot';
  foot.textContent=`Cardoso Toys · dados reais de campo · atualizado em ${GEN}`;
  app.appendChild(foot);
}

async function tryOpen(){
  const pw=document.getElementById('pw').value;
  const err=document.getElementById('lockerr');
  err.textContent='';
  if(!(window.crypto&&crypto.subtle)){err.textContent='Abra este arquivo direto no navegador (clique duas vezes nele).';return;}
  try{
    VISITS=await decrypt(pw);
    setup();
    document.getElementById('lock').hidden=true;
    document.getElementById('app').hidden=false;
    try{sessionStorage.setItem('cv_ok',pw);}catch(e){}
    render();
  }catch(e){
    err.textContent='Senha incorreta. Tente de novo.';
    document.getElementById('pw').select();
  }
}
document.getElementById('lockbtn').onclick=tryOpen;
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')tryOpen();});
// reabrir sem redigitar na mesma sessão
try{const s=sessionStorage.getItem('cv_ok'); if(s){document.getElementById('pw').value=s; tryOpen();}}catch(e){}
</script>
</body>
</html>
